<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUONGORINGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    --white:#FFFFFF;
    --paper:#F4F4F2;
    --ink:#111111;
    --ink-soft:#6E6E6E;
    --gray-100:#ECECEA;
    --gray-300:#D6D6D3;
    --gray-500:#8C8C8C;
    --gray-700:#3E3E3E;
    --gray-900:#1B1B1B;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background: var(--paper);
    font-family:'Noto Sans KR', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }

  .app-container {
    max-width: 480px;
    margin: 0 auto;
    background: var(--white);
    min-height: 100vh;
    box-shadow: 0 0 0 1px var(--gray-300), 0 30px 60px -30px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
  }

  h1{
    text-align:center;
    padding: 34px 20px 2px 20px;
    margin: 0;
    font-family:'Noto Sans KR', serif;
    font-weight: 600;
    letter-spacing: 0.5px;
    font-size: 34px;
    color: var(--ink);
  }

  h5{
    text-align:center;
    padding:0;
    margin: 4px 0 22px 0;
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 500;
  }

  .custom-header {
    background: var(--paper);
    padding: 0 20px 20px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .selector-btn {
    padding: 13px 22px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    border: 1.5px solid var(--gray-300);
    border-radius: 999px;
    background: var(--white);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 2px 0 var(--gray-300);
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.15s ease;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .selector-btn:hover{ border-color: var(--ink); }

  .selector-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 var(--gray-300);
  }

  .selector-btn.open{
    border-color: var(--ink);
    background: var(--ink);
    color: var(--white);
  }

  .arrow-icon {
    display: inline-block;
    transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    font-size: 10px;
    color: var(--ink-soft);
  }

  .selector-btn.open .arrow-icon { transform: rotate(180deg); color: var(--white); }

  .dropdown-panel {
    max-height: 0;
    opacity: 0;
    transform: translateY(-16px);
    visibility: hidden;
    background: var(--paper);
    border-bottom: 0 solid var(--gray-300);
    transition: all 0.32s cubic-bezier(0.25, 1, 0.5, 1);
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .dropdown-panel.show {
    max-height: 500px;
    opacity: 1;
    transform: translateY(0);
    visibility: visible;
    padding: 4px 20px 22px 20px;
    border-bottom: 1px solid var(--gray-300);
  }

  .panel-columns-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .panel-column { display: flex; flex-direction: column; gap: 8px; }

  .panel-column label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-soft);
    text-align: center;
    margin-bottom: 2px;
  }

  .panel-item {
    padding: 11px 6px;
    border: 1.5px solid var(--gray-300);
    border-radius: 12px;
    background: var(--white);
    font-weight: 700;
    font-size: 12.5px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
    word-break: keep-all;
    color: var(--ink);
  }

  .panel-item:hover{ border-color: var(--ink); }
  .panel-item:active { transform: translateY(1px); }

  .panel-item.active {
    border-color: var(--ink);
    color: var(--white);
    background: var(--ink);
  }

  .unit-divider{
    margin: 36px 24px 26px 24px;
    text-align:center;
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 600;
    font-style: italic;
    color: var(--ink);
    position: relative;
  }

  .unit-divider::before{
    content:"";
    display:block;
    width: 34px;
    height: 3px;
    background: var(--ink);
    border-radius: 3px;
    margin: 0 auto 12px auto;
  }

  .path{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    padding-bottom:56px;
    position: relative;
  }

  .path::before{
    content:"";
    position:absolute;
    top: 10px;
    bottom: 10px;
    left: 50%;
    width: 3px;
    transform: translateX(-1.5px);
    background-image: repeating-linear-gradient(to bottom, var(--gray-300) 0, var(--gray-300) 6px, transparent 6px, transparent 14px);
    z-index: 0;
  }

  .node {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.16);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    text-decoration: none;
    user-select: none;
    overflow: hidden;
    text-align: center;
    box-sizing: border-box;
    padding: 4px;
    position: relative;
    z-index: 1;
    border: 3px solid var(--white);
  }

  .node span {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 11px;
    margin-top: 3px;
    font-weight: 700;
    white-space: nowrap;
    word-break: keep-all;
    max-width: 78px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .node:hover{ box-shadow: 0 7px 0 rgba(0,0,0,.16); transform: translateY(-2px); }
  .node.right:hover{ transform: translateX(60px) translateY(-2px); }
  .node:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.16); }
  .node.right:active{ transform: translateX(60px) translateY(4px); }
  .right { transform: translateX(60px); }

  /* 세 유닛을 흑/백/회색 톤으로 구분 */
  .vocab{ background: var(--ink); color: var(--white); }
  .sentence{ background: var(--white); color: var(--ink); border: 3px solid var(--ink); }
  .exam{ background: var(--gray-500); color: var(--white); }

  .topbar{ display:flex; align-items:center; padding:20px; gap:14px; }
  .topbar button{
    border:none; background:var(--paper); width:38px; height:38px; border-radius:50%;
    font-size:18px; cursor:pointer; color: var(--ink-soft); font-weight: 700;
    display:flex; align-items:center; justify-content:center; transition: all 0.15s ease;
  }
  .topbar button:hover { color: var(--white); background: var(--ink); }
  .progress{ flex:1; height:12px; background:var(--paper); border:1.5px solid var(--gray-300); border-radius:30px; overflow:hidden; }
  #bar{ width:0%; height:100%; background: var(--ink); transition:width .3s ease; border-radius: 30px; }

  #quizTitle{ text-align:center; margin: 4px 0 8px 0; color: var(--ink-soft); font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px;}
  .question{
    font-family: 'Noto Sans KR', serif;
    font-size:25px;
    font-weight:600;
    text-align:center;
    margin:22px 0 12px 0;
    padding: 0 26px;
    word-break: keep-all;
    line-height: 1.45;
    color: var(--ink);
  }
  .quiz-desc { text-align: center; color: var(--ink-soft); font-size: 13.5px; margin-bottom: 22px; padding: 0 24px; word-break: keep-all; }

  .sentence-area { min-height: 90px; margin: 20px; padding: 16px; border: 1.5px dashed var(--gray-300); display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; background: var(--paper); border-radius: 18px; }
  .word-pool { margin: 24px 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

  .card {
    padding: 12px 18px; background: var(--white); border: 1.5px solid var(--gray-300); border-radius: 12px;
    font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 700; cursor:pointer;
    box-shadow: 0 2px 0 var(--gray-300); transition: all 0.1s; user-select: none; color: var(--ink);
  }
  .card:hover{ border-color: var(--ink); }
  .card:active { transform: translateY(2px); box-shadow: 0 0 0 var(--gray-300); }
  .card.used { opacity: 0.12; cursor: default; pointer-events: none; }

  .choices{ padding:16px 20px 20px 20px; display:grid; gap:11px; }
  .choice{
    padding:16px 20px; border:1.5px solid var(--gray-300); border-radius:14px; background:var(--white);
    font-family: 'Noto Sans KR', sans-serif; font-size:15.5px; font-weight: 700; cursor:pointer;
    transition: all 0.12s; text-align: left; box-shadow: 0 2px 0 var(--gray-300); color: var(--ink);
  }
  .choice:hover{ border-color: var(--ink); background: var(--gray-100); }
  .choice:active{ transform:translateY(2px); box-shadow: 0 0 0 var(--gray-300); }

  #resultBox {
    padding: 26px;
    text-align: center;
    border-radius: 20px;
    margin: 20px;
    display: block;
    opacity: 0;
    transform: translateY(24px);
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.15);
  }

  #resultBox.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

  /* 정답: 검정 배경 / 오답: 흰 배경 + 빗금 패턴으로 구분 (색상 없이) */
  #resultBox.correct{ background: var(--ink); color: var(--white); }
  #resultBox.wrong{
    background: var(--white);
    color: var(--ink);
    border: 2px solid var(--ink);
    background-image: repeating-linear-gradient(135deg, rgba(0,0,0,0.06) 0 8px, transparent 8px 16px);
  }

  #resultBox button{
    width:100%; height:52px; border:none; border-radius:14px; font-size:16px; font-weight:700;
    font-family: 'Noto Sans KR', sans-serif; cursor:pointer; margin-top:16px;
    background: var(--white); color: var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,0.15); transition: transform 0.1s ease;
  }
  #resultBox.wrong button{ background: var(--ink); color: var(--white); box-shadow: 0 3px 0 rgba(0,0,0,0.25); }
  #resultBox button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .resultTitle{ font-family:'Fraunces', serif; font-size:20px; font-weight:600; word-break: keep-all; line-height: 1.4; }

  .question{ transition: opacity 0.2s ease, transform 0.2s ease; opacity: 1; transform: translateY(0); }
  .question.fadeOut{ opacity: 0; transform: translateY(-5px); }

  @media (max-width: 380px){
    .node{ width: 76px; height: 76px; font-size: 21px; }
    .right{ transform: translateX(48px); }
    .node.right:hover{ transform: translateX(48px) translateY(-2px); }
    .node.right:active{ transform: translateX(48px) translateY(4px); }
    h1{ font-size: 28px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="app-container">

  <div id="home">
    <h1>DUONGORINGO</h1>
    <h5>made by 2than</h5>

    <div class="custom-header">
      <button class="selector-btn" id="selectorBtn" onclick="toggleDropdown()">
        <span id="currentSubjectIcon">🇨🇳</span>
        <span id="currentSelectionText">중국어 · 중학 · 미래엔 우치갑 15개정</span>
        <span class="arrow-icon">▼</span>
      </button>
    </div>

    <div class="dropdown-panel" id="dropdownPanel">
      <div class="panel-columns-grid">
        <div class="panel-column">
          <label>과목</label>
          <div id="subjectGroup"></div>
        </div>
        <div class="panel-column">
          <label>학년 과정</label>
          <div id="gradeGroup"></div>
        </div>
        <div class="panel-column">
          <label>출판사</label>
          <div id="publisherGroup"></div>
        </div>
      </div>
    </div>

    <div id="unitContainer"></div>
  </div>

  <div id="quiz" style="display:none;">
    <div class="topbar">
      <button onclick="goHome()">✕</button>
      <div class="progress">
        <div id="bar"></div>
      </div>
    </div>

    <div id="quizTitle"></div>
    <div class="question"></div>
    <div class="quiz-desc" id="quizDesc"></div>

    <div id="quizContent"></div>
    <div id="resultBox"></div>
  </div>

</div>

<script src="data.js"></script>
<script>

// 최초 초기값 자동 바인딩 설정
let currentFilters = { subject: 'chinese', grade: 'high', publisher: 'mirae' };
let currentUnit = 1;
let currentType = "vocab";
let questions = [];
let current = 0;
let selectedTokens = [];

// ===== 효과음 (mp3 파일 없이 Web Audio API로 생성) =====
let audioCtx;
function getAudioCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
  return audioCtx;
}

function playTone(freq, startTime, duration, type, gainValue){
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
  gain.gain.setValueAtTime(0.0001, ctx.currentTime + startTime);
  gain.gain.exponentialRampToValueAtTime(gainValue || 0.2, ctx.currentTime + startTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startTime + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime + startTime);
  osc.stop(ctx.currentTime + startTime + duration + 0.02);
}

function playCorrectSound(){
  try{
    playTone(523.25, 0,    0.12, "sine", 0.22); // C5
    playTone(659.25, 0.09, 0.14, "sine", 0.22); // E5
    playTone(783.99, 0.18, 0.28, "sine", 0.22); // G5
  }catch(e){ /* 오디오 미지원 환경은 조용히 무시 */ }
}

function playWrongSound(){
  try{
    playTone(220.00, 0,    0.16, "sawtooth", 0.14); // A3
    playTone(174.61, 0.12, 0.30, "sawtooth", 0.14); // F3
  }catch(e){}
}

function toggleDropdown() {
  const panel = document.getElementById("dropdownPanel");
  const btn = document.getElementById("selectorBtn");
  panel.classList.toggle("show");
  btn.classList.toggle("open");
}

// 핵심 기능: 상위 필터 변화에 연동해 버튼 리스트들을 재생성하는 엔진
function renderDropdownOptions() {
  const subGroup = document.getElementById("subjectGroup");
  const grdGroup = document.getElementById("gradeGroup");
  const pubGroup = document.getElementById("publisherGroup");

  subGroup.innerHTML = "";
  Object.keys(quizData).forEach(subKey => {
    const meta = subjectMeta[subKey] || { name: subKey, icon: "📚" };
    const activeClass = currentFilters.subject === subKey ? "active" : "";
    subGroup.innerHTML += `<div class="panel-item ${activeClass}" onclick="changeSubject('${subKey}')">${meta.icon} ${meta.name}</div>`;
  });

  grdGroup.innerHTML = "";
  const availableGrades = Object.keys(quizData[currentFilters.subject] || {});

  if (!availableGrades.includes(currentFilters.grade) && availableGrades.length > 0) {
    currentFilters.grade = availableGrades[0];
  }

  availableGrades.forEach(grdKey => {
    const label = gradeMeta[grdKey] || grdKey;
    const activeClass = currentFilters.grade === grdKey ? "active" : "";
    grdGroup.innerHTML += `<div class="panel-item ${activeClass}" onclick="changeGrade('${grdKey}')">${label}</div>`;
  });

  pubGroup.innerHTML = "";
  const availablePublishers = Object.keys(quizData[currentFilters.subject]?.[currentFilters.grade] || {});

  if (!availablePublishers.includes(currentFilters.publisher) && availablePublishers.length > 0) {
    currentFilters.publisher = availablePublishers[0];
  }

  availablePublishers.forEach(pubKey => {
    const label = publisherMeta[pubKey] || pubKey;
    const activeClass = currentFilters.publisher === pubKey ? "active" : "";
    pubGroup.innerHTML += `<div class="panel-item ${activeClass}" onclick="changePublisher('${pubKey}')">${label}</div>`;
  });

  const sMeta = subjectMeta[currentFilters.subject];
  const gName = gradeMeta[currentFilters.grade] || currentFilters.grade;
  const pName = publisherMeta[currentFilters.publisher] || currentFilters.publisher;

  document.getElementById("currentSubjectIcon").innerText = sMeta ? sMeta.icon : "📚";
  document.getElementById("currentSelectionText").innerText = `${sMeta ? sMeta.name : currentFilters.subject} · ${gName} · ${pName}`;
}

function changeSubject(subKey) {
  currentFilters.subject = subKey;
  renderDropdownOptions();
  updateHomeLayout();
}

function changeGrade(grdKey) {
  currentFilters.grade = grdKey;
  renderDropdownOptions();
  updateHomeLayout();
}

function changePublisher(pubKey) {
  currentFilters.publisher = pubKey;
  renderDropdownOptions();
  toggleDropdown();
  updateHomeLayout();
}

function updateHomeLayout() {
  const container = document.getElementById("unitContainer");
  container.innerHTML = "";

  const currentDataset = quizData[currentFilters.subject]?.[currentFilters.grade]?.[currentFilters.publisher] || {};
  const units = Object.keys(currentDataset).sort((a,b) => a - b);

  if(units.length === 0) {
    container.innerHTML = "<div style='text-align:center; padding:50px 20px; color:#999; font-size:14px;'>해당 매칭 조건에 등록된 단원이 없습니다.<br>상단 바를 눌러 선택지를 변경해 보세요!</div>";
    return;
  }

  units.forEach(unit => {
    const unitDiv = document.createElement("div");
    unitDiv.className = "unit-divider";
    unitDiv.innerHTML = `<span>${unit}단원</span>`;
    container.appendChild(unitDiv);

    const pathDiv = document.createElement("div");
    pathDiv.className = "path";
    pathDiv.innerHTML = `
      <div class="node vocab" onclick="startQuiz(${unit},'vocab','개념 및 단어')">📚<span>개념</span></div>
      <div class="node sentence right" onclick="startQuiz(${unit},'sentence','구조 및 나열')">🗣️<span>나열/매칭</span></div>
      <div class="node exam" onclick="startQuiz(${unit},'exam','실전 기출')">🎯<span>실전 기출</span></div>
    `;
    container.appendChild(pathDiv);
  });
}

function startQuiz(unit, type, displayName){
  currentUnit = unit;
  currentType = type;

  const sourceData = quizData[currentFilters.subject]?.[currentFilters.grade]?.[currentFilters.publisher]?.[unit]?.[type];
  if(!sourceData || sourceData.length === 0) {
    alert("준비된 트레이닝 문항 정보가 비어 있습니다.");
    return;
  }

  questions = JSON.parse(JSON.stringify(sourceData));
  shuffle(questions);

  if(type === "vocab" || type === "exam") {
    questions.forEach(question => { if(question.choices) shuffle(question.choices); });
  }

  current = 0;
  document.getElementById("home").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("quizTitle").innerText = `${unit}단원 - ${displayName}`;

  loadQuestion();
}

function shuffle(array){
  for(let i = array.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function loadQuestion(){
  const box = document.getElementById("resultBox");
  box.classList.remove("show", "correct", "wrong");
  if (questions.length === 0) return;

  const q = questions[current];
  const questionEl = document.querySelector(".question");
  const descEl = document.getElementById("quizDesc");
  const contentEl = document.getElementById("quizContent");

  questionEl.classList.add("fadeOut");

  setTimeout(() => {
    questionEl.innerText = q.q;
    questionEl.classList.remove("fadeOut");
    document.getElementById("bar").style.width = ((current + 1) / questions.length) * 100 + "%";

    if(currentType === "sentence") {
      selectedTokens = [];
      descEl.innerText = "💡 올바른 흐름 결합이 되도록 아래 카드를 순서대로 탭하세요.";

      let pool = [...q.displayPool];
      q.tokens.forEach(t => { if(!pool.includes(t)) pool.push(t); });
      shuffle(pool);

      contentEl.innerHTML = `
        <div class="sentence-area" id="assemblyArea"></div>
        <div class="word-pool" id="cardPool"></div>
      `;

      const poolArea = document.getElementById("cardPool");
      pool.forEach((word, idx) => {
        const btn = document.createElement("button");
        btn.className = "card";
        btn.innerText = word;
        btn.id = `card-${idx}`;
        btn.onclick = () => selectCard(word, `card-${idx}`);
        poolArea.appendChild(btn);
      });
    } else {
      descEl.innerText = "💡 제시된 보기를 읽고 알맞은 정답 카드를 하나 고르세요.";
      let html = `<div class="choices">`;
      q.choices.forEach(choice => {
        const safeChoice = choice.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        html += `<button class="choice" onclick="checkAnswer('${safeChoice}')">${choice}</button>`;
      });
      html += `</div>`;
      contentEl.innerHTML = `${html}`;
    }
  }, 150);
}

function selectCard(word, cardId) {
  const cardBtn = document.getElementById(cardId);
  if(cardBtn.classList.contains("used")) return;

  cardBtn.classList.add("used");
  selectedTokens.push({ word: word, cardId: cardId });
  renderAssembly();

  if(selectedTokens.length === questions[current].tokens.length) {
    checkSentenceAnswer();
  }
}

function renderAssembly() {
  const area = document.getElementById("assemblyArea");
  area.innerHTML = "";
  selectedTokens.forEach((item, index) => {
    const span = document.createElement("button");
    span.className = "card";
    span.style.background = "#e1f5fe";
    span.style.borderColor = "#03a9f4";
    span.innerText = item.word;
    span.onclick = () => cancelCard(index);
    area.appendChild(span);
  });
}

function cancelCard(index) {
  const item = selectedTokens[index];
  const cardBtn = document.getElementById(item.cardId);
  if(cardBtn) cardBtn.classList.remove("used");
  selectedTokens.splice(index, 1);
  renderAssembly();
}

function checkSentenceAnswer() {
  const q = questions[current];
  let isCorrect = true;
  for(let i=0; i<q.tokens.length; i++) {
    if(selectedTokens[i].word !== q.tokens[i]) { isCorrect = false; break; }
  }
  if(isCorrect) showResult(true, "🎉 정답입니다!");
  else showResult(false, `❌ 오답! 올바른 매칭: [ ${q.tokens.join(" → ")} ]`);
}

function checkAnswer(choice){
  if(choice === questions[current].answer) showResult(true, "🎉 정답입니다!");
  else showResult(false, `❌ 오답! 정답은 [ ${questions[current].answer} ] 입니다.`);
}

function showResult(correct, text){
  if(correct) playCorrectSound();
  else playWrongSound();

  const box = document.getElementById("resultBox");
  box.innerHTML = `<div class="resultTitle">${text}</div><button onclick="nextQuestion()">다음 문제</button>`;
  box.classList.remove("correct", "wrong");
  box.classList.add(correct ? "correct" : "wrong");
  box.classList.add("show");

  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function nextQuestion(){
  document.getElementById("resultBox").classList.remove("show");
  current++;
  if(current >= questions.length){
    setTimeout(() => { alert("🏆 대단해요! 유닛 트레이닝을 마쳤습니다."); goHome(); }, 200);
    return;
  }
  loadQuestion();
}

function goHome(){
  document.getElementById("resultBox").classList.remove("show");
  document.getElementById("quiz").style.display = "none";
  document.getElementById("home").style.display = "block";
  document.getElementById("bar").style.width = "0%";
  updateHomeLayout();
}

document.addEventListener("DOMContentLoaded", function() {
  renderDropdownOptions();
  updateHomeLayout();
});
</script>
</body>
</html>
